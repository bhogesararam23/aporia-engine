[workspace]
resolver = "3"
members = [
    "crates/aporia-dsl",
    "crates/aporia-boundary",
    "crates/aporia-evidence",
    "crates/aporia-ir",
    "crates/aporia-properties",
    "crates/aporia-numerics",
    "crates/aporia-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Ram Bhogesara <bhogesara.ram23@gmail.com>"]
repository = "https://github.com/bhogesararam23/aporia-engine"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# APORIA is index-heavy, numeric code. These pedantic rules fire on the shape of the
# domain rather than on mistakes: node ids are u32 by design, dimensions are small
# integers, and a scientific expression legitimately uses short names.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
float_arithmetic = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
ignored_unit_patterns = "allow"
# Naming a `Result` return type is fine; forcing every fallible parser to document an
# error section produces boilerplate, not information.
wildcard_imports = "allow"

[profile.bench]
lto = "fat"
codegen-units = 1
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
